name: Build and deploy Docker

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: handler-blog-production
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: fixture-only
          MYSQL_DATABASE: handler_blog
          MYSQL_USER: blog
          MYSQL_PASSWORD: fixture-only
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.image.outputs.reference }}
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@v4
      - name: Test deployment contracts
        run: |
          python3 -I -S -m unittest discover -s tests/deployment -v
          bash -n scripts/server/deploy-on-server.sh
          node --check scripts/check-runtime-env.mjs
          node --check scripts/migrate.mjs
      - name: Image reference
        id: image
        run: |
          repository="${GITHUB_REPOSITORY,,}"
          echo "reference=ghcr.io/${repository}:${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
      - name: Public build configuration
        id: public
        env:
          NEXT_PUBLIC_SITE_URL: ${{ vars.NEXT_PUBLIC_SITE_URL }}
          NEXT_PUBLIC_SITE_NAME: ${{ vars.NEXT_PUBLIC_SITE_NAME }}
          NEXT_PUBLIC_SITE_NAME_ZH: ${{ vars.NEXT_PUBLIC_SITE_NAME_ZH }}
          NEXT_PUBLIC_SITE_DESCRIPTION_ZH: ${{ vars.NEXT_PUBLIC_SITE_DESCRIPTION_ZH }}
          NEXT_PUBLIC_SITE_DESCRIPTION_EN: ${{ vars.NEXT_PUBLIC_SITE_DESCRIPTION_EN }}
          NEXT_PUBLIC_ALIYUN_CAPTCHA_PREFIX: ${{ vars.NEXT_PUBLIC_ALIYUN_CAPTCHA_PREFIX }}
          NEXT_PUBLIC_ALIYUN_CAPTCHA_SCENE_ID: ${{ vars.NEXT_PUBLIC_ALIYUN_CAPTCHA_SCENE_ID }}
          NEXT_PUBLIC_QINIU_DISPLAY_DOMAIN: ${{ vars.NEXT_PUBLIC_QINIU_DISPLAY_DOMAIN }}
          NEXT_PUBLIC_QINIU_SOURCE_DOMAIN: ${{ vars.NEXT_PUBLIC_QINIU_SOURCE_DOMAIN }}
        run: |
          public_args=$(python3 -I -S scripts/read-build-config.py)
          delimiter="PUBLIC_ARGS_$(cat /proc/sys/kernel/random/uuid)"
          {
            echo "args<<$delimiter"
            printf '%s\n' "$public_args"
            echo "$delimiter"
          } >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        id: build
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.image.outputs.reference }}
          build-args: ${{ steps.public.outputs.args }}
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=gha,scope=handler-blog
          cache-to: type=gha,mode=max,scope=handler-blog

      - name: Verify production loopback routing against fixture MySQL
        env:
          TEST_IMAGE: ${{ steps.image.outputs.reference }}
        run: |
          docker run --rm --network host \
            -e DATABASE_URL=mysql://blog:fixture-only@127.0.0.1:3306/handler_blog \
            "$TEST_IMAGE" node scripts/migrate.mjs
          docker run --rm -i --network host \
            -e DATABASE_URL=mysql://blog:fixture-only@127.0.0.1:3306/handler_blog \
            -e ADMIN_AUTH_SECRET=fixture-only \
            --entrypoint node "$TEST_IMAGE" - <<'JS'
          const {spawn}=require('node:child_process');
          const {readFileSync}=require('node:fs');
          const assert=require('node:assert/strict');
          const server=spawn(process.execPath,['server.js'],{stdio:'inherit'});
          (async()=>{
            try {
              let ready=false;
              for(let i=0;i<60;i++) {
                try {
                  const r=await fetch('http://127.0.0.1:8284/api/health',{signal:AbortSignal.timeout(1000)});
                  if(r.status===200) {ready=true;break;}
                } catch {}
                await new Promise(r=>setTimeout(r,250));
              }
              assert.ok(ready,'Fixture application did not become healthy');
              for(const path of ['/','/zh-CN','/en','/posts','/admin/login']) {
                const r=await fetch('http://127.0.0.1:8284'+path,{signal:AbortSignal.timeout(10000)});
                assert.equal(r.status,200,path+' did not render');
              }
              const protectedPage=await fetch('http://127.0.0.1:8284/admin',{redirect:'manual'});
              assert.equal(protectedPage.status,307);
              assert.equal(new URL(protectedPage.headers.get('location'),'http://127.0.0.1:8284').pathname,'/admin/login');
              const tls=await fetch('http://127.0.0.1:8284/',{headers:{'x-forwarded-proto':'https','x-forwarded-host':'www.huteng.com'},signal:AbortSignal.timeout(10000)});
              assert.equal(tls.status,200,'TLS proxy request failed');
              const socket=readFileSync('/proc/net/tcp','utf8').split('\n').find(l=>l.trim().split(/\s+/)[1]?.endsWith(':205C'));
              assert.ok(socket,'No IPv4 listener');
              assert.equal(socket.trim().split(/\s+/)[1],'0100007F:205C','Listener must be loopback-only');
              console.log('Production loopback routing and IPv4-only listener verified');
            } catch(e) {
              console.error(e.message);
              process.exitCode=1;
            } finally {
              server.kill('SIGTERM');
            }
          })();
          JS

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    permissions:
      contents: read
      packages: read
    env:
      IMAGE_REFERENCE: ${{ needs.build.outputs.image }}
      IMAGE_DIGEST: ${{ needs.build.outputs.digest }}
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
      DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
      DEPLOY_SSH_PORT: ${{ secrets.DEPLOY_SSH_PORT || '22' }}
      DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
      DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
      RUN_MIGRATIONS: ${{ vars.RUN_DB_MIGRATIONS || '0' }}
      MIGRATION_BACKUP_FILE: ${{ vars.MIGRATION_BACKUP_FILE }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Prepare SSH
        run: |
          [[ "$DEPLOY_HOST" =~ ^[a-zA-Z0-9.:-]+$ ]]
          [[ "$DEPLOY_USER" =~ ^[a-z_][a-z0-9_-]*$ ]]
          [[ "$DEPLOY_SSH_PORT" =~ ^[0-9]{1,5}$ ]]
          [[ -n "$DEPLOY_SSH_KEY" && -n "$DEPLOY_KNOWN_HOSTS" ]]
          [[ "$RUN_MIGRATIONS" = 0 || "$RUN_MIGRATIONS" = 1 ]]
          if [[ "$RUN_MIGRATIONS" = 1 ]]; then
            [[ "$MIGRATION_BACKUP_FILE" =~ ^/[a-zA-Z0-9_./-]+$ ]]
          fi
          install -m 700 -d "$RUNNER_TEMP/handler-blog-ssh"
          printf '%s\n' "$DEPLOY_SSH_KEY" > "$RUNNER_TEMP/handler-blog-ssh/key"
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > "$RUNNER_TEMP/handler-blog-ssh/known_hosts"
          chmod 600 "$RUNNER_TEMP/handler-blog-ssh/key" "$RUNNER_TEMP/handler-blog-ssh/known_hosts"
      - name: Load exact built image and sync runtime
        run: |
          set -euo pipefail
          ssh_options=(-p "$DEPLOY_SSH_PORT" -i "$RUNNER_TEMP/handler-blog-ssh/key" -o BatchMode=yes -o ConnectTimeout=15 -o ServerAliveInterval=15 -o ServerAliveCountMax=3 -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$RUNNER_TEMP/handler-blog-ssh/known_hosts")
          target="$DEPLOY_USER@$DEPLOY_HOST"
          image_repository="${IMAGE_REFERENCE%:*}"
          docker pull "${image_repository}@${IMAGE_DIGEST}"
          docker tag "${image_repository}@${IMAGE_DIGEST}" "$IMAGE_REFERENCE"
          ssh "${ssh_options[@]}" "$target" 'test -d /opt/handler-blog/scripts && test -d /opt/handler-blog/deploy && sudo -n test -f /opt/handler-blog/envs/app.env'
          docker save "$IMAGE_REFERENCE" | gzip | ssh "${ssh_options[@]}" "$target" 'bash -c "set -euo pipefail; gzip -d | sudo -n docker load >/dev/null"'
          # Deploy only reviewed runtime files. Production env is never uploaded or sourced.
          tar -czf - deploy/docker-compose.yml scripts/server/deploy-on-server.sh | \
            ssh "${ssh_options[@]}" "$target" 'set -eu; runtime_dir=$(mktemp -d /tmp/handler-blog-runtime.XXXXXX); trap '\''rm -rf "$runtime_dir"'\'' EXIT; tar -xzf - -C "$runtime_dir"; install -m 644 "$runtime_dir/deploy/docker-compose.yml" /opt/handler-blog/deploy/docker-compose.yml; install -m 755 "$runtime_dir/scripts/server/deploy-on-server.sh" /opt/handler-blog/scripts/deploy-on-server.sh'
          printf -v remote_command 'sudo -n env RUN_MIGRATIONS=%q MIGRATION_BACKUP_FILE=%q bash /opt/handler-blog/scripts/deploy-on-server.sh %q' "$RUN_MIGRATIONS" "$MIGRATION_BACKUP_FILE" "$IMAGE_REFERENCE"
          # This command is intentionally quoted on the runner with printf %q.
          # shellcheck disable=SC2029
          ssh "${ssh_options[@]}" "$target" "$remote_command"
      - name: Remove temporary SSH material
        if: always()
        run: rm -rf "$RUNNER_TEMP/handler-blog-ssh"
